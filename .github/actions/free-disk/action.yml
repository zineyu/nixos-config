name: Free disk space and add swap
description: >-
  托管 Linux runner 的根分区只剩 ~14 GiB，NixOS 桌面闭包 + Rust 构建产物会写满磁盘；
  同时 4 核 / 16 GiB 上并行编译多个 Rust 大 crate 会 OOM（codex 的 preBuild 注释里
  也提到单个 rustc 峰值 ~12 GiB）。两者都会让 runner 直接失联。

runs:
  using: composite
  steps:
    - name: Free disk space and add swap
      if: runner.os == 'Linux'
      shell: bash
      # set -euo pipefail：任何一步失败都让 job 立刻失败，而不是带着满磁盘/无 swap
      # 的状态继续构建（那会以 runner 失联、exit 143 的形式暴露）。
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/share/boost /opt/hostedtoolcache/CodeQL
        if ! swapon --show | grep -q /mnt/swapfile; then
          sudo fallocate -l 8G /mnt/swapfile \
            || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile >/dev/null
          sudo swapon /mnt/swapfile
        fi
        df -h / /mnt
        free -h
