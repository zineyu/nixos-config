name: Update custom packages

on:
  schedule:
    # 每天 02:00 UTC（北京时间 10:00），晚于 update.yml(01:00)：
    # 先拿到新 lock，再据此重建自定义包与其 FOD hash，否则升级 lock 后
    # hash 会再度失效。build.yml(04:00) 在本工作流之后运行。
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 构建验证会编译 dbx-desktop 这类 Rust 包，同样需要额外的磁盘与交换空间。
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          if ! swapon --show | grep -q /mnt/swapfile; then
            sudo fallocate -l 8G /mnt/swapfile \
              || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192 status=none
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile >/dev/null
            sudo swapon /mnt/swapfile
          fi
          df -h / /mnt
          free -h

      - uses: cachix/install-nix-action@v31
        with:
          # 与 build.yml / lib/nix-settings.nix 的 substituters 对齐。
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com https://ezkea.cachix.org
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= ezkea.cachix.org-1:ioBmUbJTZIKsHmWWXPe1FSFbeVe+afhfgqgTSNd34eI=
            max-jobs = auto
            http-connections = 50
            fallback = true

      # 更新后的包会重新构建，顺带推入 cache，加速当天 build.yml 与本地 rebuild
      - uses: cachix/cachix-action@v17
        with:
          name: zineyu
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # 各包的更新逻辑内嵌在 passthru.updateScript 中：
      # - 简单包（breezex-cursor / jj-bond / rime-flypy / squirrel）：薄封装 nix-update
      #   （靠 meta.position 定位与模块共置的 package.nix）
      # - codegraph：多平台 hash 表，自定义脚本（programs/dev/codegraph/update.sh）
      # - dbx-desktop：多源 + FOD hash 重建，自定义脚本（programs/gui/dbx-desktop/update.sh，
      #   模式参考上游 .github/workflows/update-nix-pnpm-hash.yml）
      - name: Run passthru.updateScript for each custom package
        id: update_scripts
        run: |
          set -uo pipefail
          failed=""
          for pkg in breezex-cursor codegraph dbx-desktop jj-bond rime-flypy squirrel; do
            echo "=== $pkg ==="
            if ! nix run ".#$pkg.updateScript"; then
              echo "::error::$pkg 更新失败，已跳过（package.nix 的半成品改动会被回退）"
              failed="$failed $pkg"
            fi
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

      # 构建验证有变更的包；失败的包回退其更新（由 Gotify 通知人工处理）。
      # squirrel 为 darwin-only（构建需 /usr/bin/codesign），无法在 Linux runner 验证，
      # 其 src hash 已由 nix-update 通过 FOD 重建校验，可靠性足够。
      - name: Build updated packages (x86_64-linux)
        id: verify
        env:
          FAILED_SCRIPTS: ${{ steps.update_scripts.outputs.failed }}
        run: |
          set -euo pipefail
          failed=""
          # updateScript 中途失败会留下半更新的配方（部分 hash 已改、部分没改），
          # 不可信：直接回退，避免提交不完整的更新（也可能碰巧仍可构建）。
          for pkg in ${FAILED_SCRIPTS}; do
            git checkout -- "*${pkg}/package.nix" 2>/dev/null || true
          done
          changed=$(git diff --name-only || true)
          for pkg in breezex-cursor codegraph dbx-desktop jj-bond rime-flypy; do
            if grep -q "/${pkg}/package.nix$" <<<"$changed"; then
              echo "=== build $pkg ==="
              if ! nix build ".#$pkg" -L --no-link; then
                echo "::warning::$pkg 更新后构建失败，回退该包的更新"
                # 单一路径规格（git 的 * 可跨目录），避免同名目录出现第二个 package.nix 时失败
                git checkout -- "*${pkg}/package.nix"
                failed="$failed $pkg"
              fi
            fi
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- '*package.nix'; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- '*package.nix'
          fi

      - name: Commit and push
        if: steps.changes.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*package.nix'
          git commit -m "chore: auto-update custom package recipes" \
            -m "$(git diff --cached --stat | tail -1)"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Notify via Gotify
        if: steps.changes.outputs.updated == 'true'
        env:
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          FAILED: ${{ steps.verify.outputs.failed }}
        run: |
          msg="自定义包（package.nix）已更新并通过构建验证，详见 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$FAILED" ]; then
            msg="$msg；以下包构建失败已回退，需人工处理:$FAILED"
          fi
          curl -sf -X POST "https://gotify.zineyu.cn/message?token=$GOTIFY_TOKEN" \
            -F "title=自定义包已更新" \
            -F "message=$msg" \
            -F "priority=5"

      - name: Notify failure via Gotify
        if: failure()
        env:
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        run: |
          curl -sf -X POST "https://gotify.zineyu.cn/message?token=$GOTIFY_TOKEN" \
            -F "title=自定义包更新失败" \
            -F "message=updateScript 或构建验证未通过，详见 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "priority=8"

      # 注意：updateScript 失败不会让本 job 失败，也不一定产生 package.nix 变更，
      # 因此上面的"已更新"通知不会触发——这正是 dbx-desktop 静默停更 18 天的原因。
      - name: Notify skipped updateScripts via Gotify
        if: steps.update_scripts.outputs.failed != ''
        env:
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          FAILED_SCRIPTS: ${{ steps.update_scripts.outputs.failed }}
        run: |
          curl -sf -X POST "https://gotify.zineyu.cn/message?token=$GOTIFY_TOKEN" \
            -F "title=自定义包自动更新被跳过" \
            -F "message=以下包的 updateScript 执行失败，本次未更新，需人工处理: $FAILED_SCRIPTS；详见 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "priority=8"
