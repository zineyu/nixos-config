name: Build hosts

on:
  schedule:
    # 每天 04:00 UTC（北京时间 12:00），在 update.yml(01:00) 与 update-pkgs.yml(02:00)
    # 之后运行，以缓存最新 lock 与最新包
    - cron: "0 4 * * *"
  workflow_dispatch:
  # 配置本身的改动也要触发：此前只有 schedule，inventory.nix 从 hosts/ 移到仓库根后
  # CI 连续 5 天在 inventory job 上失败而无人察觉（那次改动没有任何提交触发它）。
  # push 只跑 inventory 求值 + lint，整机闭包仍只在 schedule / dispatch 上构建。
  push:
    branches: [main]
    paths:
      - .github/**
      - flake.lock
      - flake.nix
      - inventory.nix
      - lib/**
      - hosts/**
      - modules/**
      - overlays/**
      - pkgs/**
      - programs/**
      - scripts/**
      - vars/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # 矩阵从 inventory.nix 派生，而不是手写：新注册的主机自动进入 CI。
  # 之前的静态列表漏掉了 work-hp-laptop，它从未被构建过。
  # inventory.nix 只含字面量，不依赖任何 flake 输入，因此可以直接求值。
  inventory:
    name: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix-setup

      - name: Derive host matrix
        id: matrix
        run: |
          set -euo pipefail
          json=$(nix eval --json --file ./inventory.nix)
          matrix=$(jq -c '{
            include: [to_entries[] | {
              host: .key,
              system: .value.system,
              os: (if (.value.system | endswith("darwin")) then "macos-latest" else "ubuntu-latest" end)
            }]
          }' <<<"$json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  # 结构门禁（ADR-0018）：格式化、deadnix、statix、skills 与差异轴 lint。
  # 单独一个轻量 job，不依赖任何主机构建，几十秒内失败。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nix-setup

      - name: Lint
        run: nix build .#checks.x86_64-linux.lint -L

      # deploy-rs 的 deployChecks 只有一个 `nix flake check` 会求值它，而 update.yml 里
      # 那次只在 flake.lock 变化时跑。--no-build 只求值不构建闭包：手改 deploy.nodes
      # 的结构错误（缺 profiles、hostname 拼错）因此立刻失败，成本仍是秒级。
      - name: Check deploy nodes evaluate
        run: nix flake check --no-build

  build:
    needs: inventory
    # push 触发只跑 inventory + lint；整机闭包只在 schedule / dispatch 上构建。
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    name: build ${{ matrix.host }} (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    # runner 失联时不要一直挂着：正常情况 tianxuan/macbook 约 20-40 分钟。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk

      - uses: ./.github/actions/nix-setup
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.host }}
        run: nix build ".#${{ matrix.host }}" -L
