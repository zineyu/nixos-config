name: Update flake.lock

on:
  schedule:
    # 每天 02:00 UTC（北京时间 10:00）
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Update flake.lock
        run: nix flake update

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet flake.lock; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify (nix flake check)
        if: steps.changes.outputs.updated == 'true'
        run: nix flake check --print-build-logs

      - name: Commit and push
        if: steps.changes.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update flake.lock"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Notify via Gotify
        if: steps.changes.outputs.updated == 'true'
        env:
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        run: |
          curl -sf -X POST "https://gotify.zineyu.cn/message?token=$GOTIFY_TOKEN" \
            -F "title=flake.lock 已更新" \
            -F "message=home-manager flake inputs 已更新并通过 nix flake check，详见 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "priority=5"

      - name: Notify failure via Gotify
        if: failure()
        env:
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        run: |
          curl -sf -X POST "https://gotify.zineyu.cn/message?token=$GOTIFY_TOKEN" \
            -F "title=flake.lock 更新失败" \
            -F "message=更新或 nix flake check 未通过，详见 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "priority=8"
