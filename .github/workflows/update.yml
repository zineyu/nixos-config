name: Update flake.lock

on:
  schedule:
    # 每天 01:00 UTC（北京时间 09:00），必须早于 update-pkgs.yml(02:00)：
    # nixpkgs 升级 sqlite 等输入会让 FOD hash 失效，自定义包的 hash 修复
    # 只能在 lock 更新之后进行。
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          # `nix flake check` 会构建 deploy-rs 的 activation profile（即整机闭包），
          # 与 build.yml 一样需要 llm-agents.nix 的预构建二进制，否则同样会掉进
          # 从源码编译 Rust 的坑。与 lib/nix-settings.nix 的 substituters 对齐。
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com https://ezkea.cachix.org
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= ezkea.cachix.org-1:ioBmUbJTZIKsHmWWXPe1FSFbeVe+afhfgqgTSNd34eI=
            max-jobs = auto
            http-connections = 50
            fallback = true

      - name: Update flake.lock
        run: |
          set -euo pipefail
          # 见 scripts/update-flake.sh：nixpkgs 钉到 nixos-unstable 的频道修订
          # （Hydra 已构建、cache.nixos.org 有产物的 commit），其余 input 按分支更新。
          rev=$(./scripts/update-flake.sh)
          echo "nixos-unstable channel rev: $rev"
          echo "NIXPKGS_REV=$rev" >> "$GITHUB_ENV"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet flake.lock; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify (nix flake check)
        if: steps.changes.outputs.updated == 'true'
        run: nix flake check --print-build-logs

      - name: Commit and push
        if: steps.changes.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update flake.lock" \
            -m "nixpkgs pinned to nixos-unstable channel ${NIXPKGS_REV}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Notify via Gotify
        if: steps.changes.outputs.updated == 'true'
        env:
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        run: |
          curl -sf -X POST "https://gotify.zineyu.cn/message?token=$GOTIFY_TOKEN" \
            -F "title=flake.lock 已更新" \
            -F "message=flake inputs 已更新（nixpkgs = nixos-unstable 频道 ${NIXPKGS_REV}）并通过 nix flake check，详见 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "priority=5"

      - name: Notify failure via Gotify
        if: failure()
        env:
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        run: |
          curl -sf -X POST "https://gotify.zineyu.cn/message?token=$GOTIFY_TOKEN" \
            -F "title=flake.lock 更新失败" \
            -F "message=更新或 nix flake check 未通过，详见 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "priority=8"
