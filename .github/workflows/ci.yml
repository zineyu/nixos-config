name: Nix Build CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - "Justfile"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - "Justfile"

jobs:
  check:
    name: Flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix-path: "nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz"
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Run flake check
        run: nix flake check --print-build-logs

  build:
    name: Build NixOS systems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Free disk space
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage
          witness-carnage: true
          mnt-safe-haven: 6144

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix-path: "nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz"
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # Watch the store and push build artifacts to cachix (main only).
      # PR builds are not pushed to avoid polluting the cache, and forked PRs
      # cannot access the CACHIX_AUTH_TOKEN secret anyway.
      - uses: cachix/cachix-action@v16
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: zineyu
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Apply shared Nix settings
        shell: bash
        run: |
          nix build ".#nix-conf"
          mkdir -p ~/.config/nix
          cat ./result | tee -a ~/.config/nix/nix.conf

      - name: Restart Nix Daemon
        shell: bash
        run: |
          sudo systemctl restart nix-daemon.service

      - name: Build system closures
        shell: bash
        run: |
          mapfile -t hosts < <(nix eval --json ".#nixosConfigurations" --apply "builtins.attrNames" | jq --raw-output '.[]')
          for host in "${hosts[@]}"; do
            nix build ".#nixosConfigurations.$host.config.system.build.toplevel" \
              --fallback \
              --print-build-logs \
              --out-link "result-$host"
          done
