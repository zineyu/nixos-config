experimental:
  sniff-tls-sni: true
external-controller: 127.0.0.1:9090
geodata-mode: true
geoip: cn
ip-geosite: cn
ipv6: false
log-level: info
mixed-port: 7893
mode: rule
port: 7890
profile:
  store-fake-ip: true
  store-selected: true
proxy-providers:
  nodes:
    type: file
    # 由 modules/darwin/mihomo.nix 注入：sops 解密的代理凭据（secrets/mihomo.yaml）。
    path: "@proxies_file@"

proxy-groups:
  - name: PROXY
    type: select
    use:
      - nodes
    proxies:
      - DIRECT
redir-port: 7892
rule-providers:
  apple:
    behavior: domain
    format: yaml
    interval: 86400
    path: ./ruleset/apple.txt
    proxy: DIRECT
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt
  applications:
    behavior: classical
    format: yaml
    interval: 86400
    path: ./ruleset/applications.txt
    proxy: DIRECT
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt
  cncidr:
    behavior: ipcidr
    format: yaml
    interval: 86400
    path: ./ruleset/cncidr.txt
    proxy: DIRECT
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt
  direct:
    behavior: domain
    format: yaml
    interval: 86400
    path: ./ruleset/direct.txt
    proxy: DIRECT
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
  gfw:
    behavior: domain
    format: yaml
    interval: 86400
    path: ./ruleset/gfw.txt
    proxy: DIRECT
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt
  google:
    behavior: domain
    format: yaml
    interval: 86400
    path: ./ruleset/google.txt
    proxy: DIRECT
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt
  icloud:
    behavior: domain
    format: yaml
    interval: 86400
    path: ./ruleset/icloud.txt
    proxy: DIRECT
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt
  lancidr:
    behavior: ipcidr
    format: yaml
    interval: 86400
    path: ./ruleset/lancidr.txt
    proxy: DIRECT
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
  private:
    behavior: domain
    format: yaml
    interval: 86400
    path: ./ruleset/private.txt
    proxy: DIRECT
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt
  proxy:
    behavior: domain
    format: yaml
    interval: 86400
    path: ./ruleset/proxy.txt
    proxy: DIRECT
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt
  reject:
    behavior: domain
    format: yaml
    interval: 86400
    path: ./ruleset/reject.txt
    proxy: DIRECT
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
  telegramcidr:
    behavior: ipcidr
    format: yaml
    interval: 86400
    path: ./ruleset/telegramcidr.txt
    proxy: DIRECT
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt
  tld-not-cn:
    behavior: domain
    format: yaml
    interval: 86400
    path: ./ruleset/tld-not-cn.txt
    proxy: DIRECT
    type: http
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt
rules:
- PROCESS-NAME,cfst,DIRECT
- PROCESS-NAME,CloudflareST,DIRECT
- RULE-SET,applications,DIRECT
- DOMAIN,clash.razord.top,DIRECT
- DOMAIN,yacd.haishan.me,DIRECT
- RULE-SET,private,DIRECT
- RULE-SET,lancidr,DIRECT,no-resolve
- GEOIP,LAN,DIRECT,no-resolve
- RULE-SET,reject,REJECT
- AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
- AND,((NETWORK,UDP),(DST-PORT,853)),REJECT
- RULE-SET,icloud,DIRECT
- RULE-SET,apple,DIRECT
- RULE-SET,direct,DIRECT
- DOMAIN-SUFFIX,browserleaks.com,PROXY
- DOMAIN-SUFFIX,ip.sb,PROXY
- DOMAIN-SUFFIX,ip-api.com,PROXY
- GEOSITE,cn,DIRECT
- RULE-SET,cncidr,DIRECT,no-resolve
- GEOIP,CN,DIRECT
- DOMAIN-SUFFIX,openai.com,PROXY
- DOMAIN-SUFFIX,chatgpt.com,PROXY
- DOMAIN-SUFFIX,oaistatic.com,PROXY
- DOMAIN-SUFFIX,oaiusercontent.com,PROXY
- DOMAIN-SUFFIX,anthropic.com,PROXY
- DOMAIN-SUFFIX,claude.ai,PROXY
- DOMAIN,gemini.google.com,PROXY
- DOMAIN,aistudio.google.com,PROXY
- DOMAIN,makersuite.google.com,PROXY
- DOMAIN,generativelanguage.googleapis.com,PROXY
- DOMAIN-SUFFIX,perplexity.ai,PROXY
- DOMAIN-SUFFIX,poe.com,PROXY
- DOMAIN-SUFFIX,x.ai,PROXY
- DOMAIN-SUFFIX,grok.com,PROXY
- RULE-SET,google,PROXY
- RULE-SET,gfw,PROXY
- RULE-SET,proxy,PROXY
- RULE-SET,tld-not-cn,PROXY
- RULE-SET,telegramcidr,PROXY,no-resolve
- MATCH,PROXY
socks-port: 7891
tcp-concurrent: true
tun:
  auto-detect-interface: true
  auto-redirect: true
  auto-route: true
  dns-hijack:
  - any:53
  - tcp://any:53
  enable: true
  route-exclude-address:
  - 100.64.0.0/10
  stack: mixed
  strict-route: true
unified-delay: true


